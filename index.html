<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองห้องประชุมโรงเรียนวิเชียรชม</title>
  <meta name="description" content="ดูตารางห้องว่างและจองห้องประชุมประกายเพชร หอประชุมวิเชียรคีรี โรงเรียนวิเชียรชม ได้ทันที">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ระบบจองห้องประชุมโรงเรียนวิเชียรชม">
  <meta property="og:description" content="ดูตารางห้องว่างและจองห้องประชุมได้ทันที">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 50V16a3 3 0 0 1 3-3h22a3 3 0 0 1 3 3v34M12 50h40M26 22h4M34 22h4M26 30h4M34 30h4M28 50v-9h8v9' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    * { font-family: 'Inter', 'Prompt', sans-serif; }
    .modal-overlay { animation: fadeIn 0.2s ease; }
    .modal-content { animation: slideUp 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .lang-btn { padding: 0.35rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.2s; border: 1px solid rgb(219, 234, 254); }
    .lang-btn.active { background-color: rgb(59, 130, 246); color: white; border-color: rgb(59, 130, 246); }
    .lang-btn.inactive { background-color: rgb(243, 244, 246); color: rgb(107, 114, 128); }

    /* ให้ช่องในตารางยืดเต็มความสูงของแถว (ใช้คู่กับ height:1px บน td) */
    .cell-fill { height: 100%; }
    select:disabled, option:disabled { color: #94a3b8; }
  </style>
 </head>
 <body class="min-h-screen bg-gradient-to-br from-sky-50 via-blue-50 to-indigo-50 text-slate-800">
  <div id="app" class="min-h-screen flex flex-col">

   <!-- ===== Header ===== -->
   <header class="bg-white/80 backdrop-blur-md border-b border-blue-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 md:py-4">
     <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
       <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl flex items-center justify-center shadow-lg flex-shrink-0" aria-hidden="true">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
       </div>
       <div class="min-w-0">
        <h1 class="text-lg md:text-xl font-semibold text-slate-800 truncate" data-i18n="title">ระบบจองห้องประชุมโรงเรียนวิเชียรชม</h1>
        <p class="text-xs text-slate-500 truncate" data-i18n="subtitle">ดูตารางห้องว่างและจองได้ทันที</p>
       </div>
      </div>
      <div class="flex items-center justify-between md:justify-end gap-3">
       <div class="flex gap-1 bg-slate-100 p-1 rounded-lg" role="group" aria-label="Language">
        <button type="button" id="lang-th" class="lang-btn active text-xs md:text-sm" aria-pressed="true">ไทย</button>
        <button type="button" id="lang-en" class="lang-btn inactive text-xs md:text-sm" aria-pressed="false">English</button>
       </div>
       <button type="button" id="admin-btn" class="px-3 py-2 md:px-4 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg text-sm font-medium transition-all flex items-center gap-2 border border-blue-200 whitespace-nowrap">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        <span>Admin</span>
       </button>
      </div>
     </div>
    </div>
   </header>

   <main class="flex-1 w-full max-w-7xl mx-auto px-3 md:px-4 py-4 md:py-6 pb-28">

    <!-- ===== Date navigation ===== -->
    <section class="bg-white rounded-2xl p-4 md:p-5 mb-4 border border-blue-100 shadow-sm">
     <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center justify-between w-full sm:w-auto gap-3">
       <button type="button" id="prev-date" class="p-2 bg-blue-50 hover:bg-blue-100 rounded-lg transition-all text-slate-600 border border-blue-200" data-i18n-aria="prevDay" aria-label="วันก่อนหน้า">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
       </button>
       <div class="relative text-center min-w-[190px] rounded-lg hover:bg-blue-50/60 transition-colors px-2 py-1 cursor-pointer">
        <p id="current-date" class="text-xl md:text-2xl font-semibold text-slate-800"></p>
        <p class="text-sm text-blue-600 font-medium flex items-center justify-center gap-1.5">
         <span id="current-day"></span>
         <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        </p>
        <!-- ช่องเลือกวันที่แบบโปร่งใส วางทับข้อความวันที่ แตะแล้วเปิดปฏิทิน -->
        <input type="date" id="jump-date" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" data-i18n-aria="pickDate" aria-label="เลือกวันที่">
       </div>
       <button type="button" id="next-date" class="p-2 bg-blue-50 hover:bg-blue-100 rounded-lg transition-all text-slate-600 border border-blue-200" data-i18n-aria="nextDay" aria-label="วันถัดไป">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
       </button>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
       <button type="button" id="today-btn" class="flex-1 sm:flex-none px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition-all shadow-md" data-i18n="today">วันนี้</button>
       <button type="button" id="refresh-btn" class="p-2 bg-white hover:bg-blue-50 rounded-lg transition-all text-slate-500 border border-blue-200" data-i18n-aria="refresh" aria-label="รีเฟรช">
        <svg id="refresh-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
       </button>
      </div>
     </div>
     <p id="status-line" class="mt-3 text-xs text-slate-400 text-center sm:text-right" aria-live="polite"></p>
    </section>

    <div id="error-banner" class="hidden mb-4 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 px-4 py-3 text-sm flex items-start gap-3" role="alert">
     <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
     <span id="error-banner-text" class="flex-1"></span>
     <button type="button" data-action="retry" class="px-3 py-1 rounded-lg bg-white border border-amber-300 hover:bg-amber-100 font-medium whitespace-nowrap" data-i18n="retry">ลองใหม่</button>
    </div>

    <!-- ===== Schedule table ===== -->
    <section id="schedule-section" class="bg-white rounded-2xl border border-blue-100 overflow-hidden shadow-sm mb-3 scroll-mt-28">
     <div class="overflow-x-auto overscroll-x-contain custom-scrollbar">
      <table class="w-full text-sm border-collapse">
       <thead id="schedule-head"></thead>
       <tbody id="schedule-body"></tbody>
      </table>
     </div>
    </section>

    <div class="flex items-center justify-center gap-x-6 gap-y-2 text-xs md:text-sm flex-wrap mb-8 text-slate-600">
     <div class="flex items-center gap-2"><div class="w-4 h-4 bg-green-100 border border-green-300 rounded"></div><span data-i18n="legendAvailable">ว่าง (แตะเพื่อจอง)</span></div>
     <div class="flex items-center gap-2"><div class="w-4 h-4 bg-red-100 border border-red-300 rounded"></div><span data-i18n="booked">จองแล้ว</span></div>
     <div class="flex items-center gap-2"><div class="w-4 h-4 bg-slate-100 border border-slate-200 rounded"></div><span data-i18n="past">ผ่านไปแล้ว</span></div>
    </div>

    <!-- ===== Upcoming bookings ===== -->
    <section aria-labelledby="upcoming-heading">
     <div class="flex items-end justify-between gap-2 mb-3">
      <div class="flex items-center gap-2">
       <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
       <h2 id="upcoming-heading" class="text-lg font-semibold text-slate-800" data-i18n="upcoming">รายการจองเร็วๆ นี้</h2>
      </div>
      <span id="upcoming-hint" class="text-xs text-slate-500"></span>
     </div>
     <div id="upcoming-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </section>
   </main>

   <!-- ===== Book buttons ===== -->
   <button type="button" id="book-room-fab" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl flex items-center justify-center z-30 hover:bg-blue-700 transition-transform active:scale-95" data-i18n-aria="bookRoom" aria-label="จองห้องประชุม">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
   </button>
   <div class="hidden md:flex justify-center fixed bottom-8 left-0 right-0 z-30 pointer-events-none">
    <button type="button" id="book-room-btn" class="pointer-events-auto px-8 py-3 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all flex items-center gap-2 transform hover:-translate-y-1">
     <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
     <span data-i18n="bookRoom">จองห้องประชุม</span>
    </button>
   </div>

   <!-- ===== Booking modal ===== -->
   <div id="booking-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="booking-title">
    <div class="modal-overlay fixed inset-0 bg-black/30 backdrop-blur-sm" data-close="booking-modal"></div>
    <div class="relative min-h-full flex items-end md:items-center justify-center p-0 md:p-4 pointer-events-none">
     <div class="modal-content pointer-events-auto bg-white rounded-t-2xl md:rounded-2xl w-full max-w-md border border-blue-100 shadow-2xl">
      <div class="p-5 border-b border-blue-100 bg-white rounded-t-2xl flex items-center justify-between">
       <h3 id="booking-title" class="text-xl font-semibold text-slate-800" data-i18n="bookRoom">จองห้องประชุม</h3>
       <button type="button" class="p-2 hover:bg-blue-50 rounded-lg transition-all text-slate-400" data-close="booking-modal" data-i18n-aria="close" aria-label="ปิด">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
       </button>
      </div>
      <form id="booking-form" class="p-5 space-y-4 max-h-[75vh] overflow-y-auto" novalidate>
       <div>
        <label for="booking-room" class="block text-sm font-medium text-slate-700 mb-2"><span data-i18n="selectRoom">เลือกห้อง</span> *</label>
        <select id="booking-room" required class="w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"></select>
       </div>
       <div>
        <label for="booking-date" class="block text-sm font-medium text-slate-700 mb-2"><span data-i18n="date">วันที่</span> *</label>
        <input type="date" id="booking-date" required class="w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all">
       </div>
       <div>
        <label for="booking-topic" class="block text-sm font-medium text-slate-700 mb-2"><span data-i18n="topic">หัวข้อประชุม</span> *</label>
        <input type="text" id="booking-topic" required maxlength="200" autocomplete="off" class="w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all" data-i18n-ph="topicPh" placeholder="ระบุหัวข้อการประชุม">
       </div>
       <div>
        <label for="booking-name" class="block text-sm font-medium text-slate-700 mb-2"><span data-i18n="name">ชื่อผู้จอง</span> *</label>
        <input type="text" id="booking-name" required maxlength="100" autocomplete="name" class="w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all" data-i18n-ph="namePh" placeholder="ระบุชื่อ-นามสกุล">
       </div>
       <div class="grid grid-cols-2 gap-3">
        <div>
         <label for="booking-start" class="block text-sm font-medium text-slate-700 mb-2"><span data-i18n="start">เวลาเริ่ม</span> *</label>
         <select id="booking-start" required class="w-full px-3 py-3 bg-blue-50 border border-blue-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"></select>
        </div>
        <div>
         <label for="booking-end" class="block text-sm font-medium text-slate-700 mb-2"><span data-i18n="end">เวลาสิ้นสุด</span> *</label>
         <select id="booking-end" required class="w-full px-3 py-3 bg-blue-50 border border-blue-200 rounded-xl text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"></select>
        </div>
       </div>
       <p id="slot-hint" class="hidden text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3"></p>
       <div id="booking-error" class="hidden text-red-600 text-sm bg-red-50 p-3 rounded-lg border border-red-200 flex items-start gap-2" role="alert">
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span id="booking-error-text" class="break-words"></span>
       </div>
       <div class="pt-1">
        <button type="submit" id="submit-booking" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:bg-blue-300 disabled:cursor-not-allowed text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg">
         <svg id="submit-spinner" class="hidden animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
         <span id="submit-label" data-i18n="confirm">ยืนยันการจอง</span>
        </button>
       </div>
      </form>
     </div>
    </div>
   </div>

   <!-- ===== Admin modal ===== -->
   <div id="admin-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <div class="modal-overlay fixed inset-0 bg-black/30 backdrop-blur-sm" data-close="admin-modal"></div>
    <div class="relative min-h-full flex items-center justify-center p-4 pointer-events-none">
     <div class="modal-content pointer-events-auto bg-white rounded-2xl w-full max-w-2xl border border-blue-100 shadow-xl max-h-[90vh] flex flex-col">
      <div class="p-5 border-b border-blue-100 flex-shrink-0 flex items-center justify-between gap-3">
       <h3 id="admin-title" class="text-xl font-semibold text-slate-800">🔐 <span data-i18n="adminPanel">Admin Panel</span></h3>
       <div class="flex items-center gap-2">
        <button type="button" id="admin-logout" class="hidden px-3 py-1.5 text-sm rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50" data-i18n="logout">ออกจากระบบ</button>
        <button type="button" class="p-2 hover:bg-blue-50 rounded-lg transition-all text-slate-400" data-close="admin-modal" data-i18n-aria="close" aria-label="ปิด">
         <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
       </div>
      </div>
      <form id="admin-login" class="p-6 space-y-4">
       <div>
        <label for="admin-password" class="block text-sm font-medium text-slate-700 mb-2" data-i18n="adminPassword">รหัสผ่าน Admin</label>
        <input type="password" id="admin-password" autocomplete="current-password" class="w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all" data-i18n-ph="passwordPh" placeholder="ใส่รหัสผ่าน">
       </div>
       <div id="admin-login-error" class="hidden text-red-600 text-sm bg-red-50 p-3 rounded-lg border border-red-200" role="alert"></div>
       <button type="submit" class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl transition-all shadow-md" data-i18n="login">เข้าสู่ระบบ</button>
      </form>
      <div id="admin-content" class="hidden flex-1 min-h-0 flex flex-col">
       <div class="p-4 border-b border-blue-100 flex-shrink-0 bg-slate-50 space-y-3">
        <div class="grid grid-cols-2 gap-2">
         <select id="admin-filter-room" class="px-3 py-2 bg-white border border-blue-200 rounded-lg text-slate-700 text-sm focus:outline-none focus:border-blue-500 shadow-sm" data-i18n-aria="selectRoom" aria-label="เลือกห้อง"></select>

    },
    en: {
      title: 'Wichianchom School Room Booking', subtitle: 'Check availability and book instantly',
      today: 'Today', tomorrow: 'Tomorrow', refresh: 'Refresh', prevDay: 'Previous day', nextDay: 'Next day', pickDate: 'Pick a date',
      time: 'Time', now: 'Now', available: 'Free', book: 'Book', tapToBook: 'Book', booked: 'Booked', past: 'Past',
      legendAvailable: 'Free (tap to book)', overlap: '⚠ Overlapping', ongoing: 'In use',
      upcoming: 'Upcoming Bookings', upcomingHint: n => `Next ${n} days`, noUpcoming: 'No bookings in this period', moreUpcoming: n => `and ${n} more — pick a date above to see all`,

      date: 'Date', topic: 'Meeting topic', topicPh: 'Enter meeting topic', name: 'Organizer', namePh: 'Enter your full name',
      start: 'Start', end: 'End', confirm: 'Confirm Booking', checking: 'Checking...', saving: 'Booking...',
      timeUnit: '', bookedSuffix: ' (booked)', pastSuffix: ' (past)', pickRoomFirst: 'Choose a room to see its free times',
      roomFull: 'This room has no free time left on the selected date. Try another date or room.',
      fillAll: 'Please fill in every field.', pastDate: 'You cannot book a date or time that has already passed.',
      conflict: 'Someone just booked this time. Please choose another time.',

      notConfirmed: 'The system did not confirm this booking. Please check the schedule before trying again to avoid a duplicate.',

      loading: 'Loading...', loadFailedEmpty: 'Could not load bookings, so the schedule is hidden to avoid showing rooms as free by mistake.',
      retry: 'Retry', updatedAt: t => `Last updated ${t} · auto-refreshing`,
      staleData: t => `Cannot connect. The data shown may be out of date (last updated ${t}).`,
      adminPanel: 'Admin Panel', adminPassword: 'Admin password', passwordPh: 'Enter password', login: 'Log in', logout: 'Log out',
      wrongPassword: 'Incorrect password', cryptoUnsupported: 'This browser cannot check the password. Please open the site over https.',
      periodUpcoming: 'Upcoming', periodPast: 'Past', periodAll: 'All', searchPh: 'Search topic or organizer',
      count: n => `${n} booking${n === 1 ? '' : 's'}`, noBookings: 'No bookings', noId: 'This booking has no reference id and cannot be deleted here.',
      deleteTitle: 'Confirm delete?', deleteText: (topic, name, when) => `Delete "${topic}" by ${name} (${when})?`,
      cancel: 'Cancel', del: 'Delete', deleting: 'Deleting...', deleteSuccess: 'Booking deleted', alreadyDeleted: 'This booking was already deleted',
      deleteNotConfirmed: 'The system did not confirm the deletion. Please refresh and check again.', close: 'Close',
      dayNames: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
      dayShort: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      monthShort: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],

    }
  };

  // ---------- utilities ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  };
  function escapeHtml(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function parseDateStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function todayStr() { return toDateStr(new Date()); }
  function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
  function fromMin(min) { return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`; }
  function addDays(date, n) { return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n); }
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const OPEN_MIN = OPEN_HOUR * 60;
  const CLOSE_MIN = CLOSE_HOUR * 60;
  const SLOTS = [];
  for (let m = OPEN_MIN; m < CLOSE_MIN; m += SLOT_MINUTES) SLOTS.push({ start: m, end: Math.min(m + SLOT_MINUTES, CLOSE_MIN) });

  // ---------- state ----------
  let lang = storage.get('wcc-lang') === 'en' ? 'en' : 'th';
  const T = () => I18N[lang];
  let bookings = [];
  let dataStatus = 'loading';   // loading | ok | stale | error
  let lastUpdated = null;
  let viewDate = parseDateStr(todayStr());
  let isAdmin = false;
  let bookingToDelete = null;
  let submitting = false;
  let deleting = false;
  let adminListCache = [];
  const openModals = [];

  // ---------- data (ส่ง/รับรูปแบบเดิมทุกอย่าง ไม่ต้องแก้ Apps Script) ----------
  const api = {
    async read() {
      const res = await fetch(GOOGLE_SCRIPT_URL + '?action=read', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('Unexpected response');
      return data.map(normalizeBooking).filter(Boolean);
    },
    async create(payload) {
      // ผลลัพธ์จริงตรวจจากการโหลดข้อมูลใหม่หลังส่ง จึงไม่ต้องพึ่งคำตอบของ POST
      try { await fetch(GOOGLE_SCRIPT_URL + '?action=create', { method: 'POST', body: JSON.stringify(payload) }); }
      catch (e) { console.warn('create request:', e); }
    },
    async remove(backendId) {
      try { await fetch(GOOGLE_SCRIPT_URL + '?action=delete&id=' + encodeURIComponent(backendId), { method: 'POST' }); }
      catch (e) { console.warn('delete request:', e); }
    }
  };

  function normalizeTime(v) {
    if (v === null || v === undefined || v === '') return '';
    const s = String(v).trim();
    const m = s.match(/^(\d{1,2})[:.](\d{2})(?::\d{2})?$/);
    if (m) return `${pad(+m[1])}:${m[2]}`;
    if (s.includes('T')) { const d = new Date(s); if (!isNaN(d)) return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
    return '';
  }
  function normalizeDate(v) {
    if (!v) return '';
    const s = String(v).trim();
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
    const d = new Date(s);
    return isNaN(d) ? '' : toDateStr(d);
  }
  function normalizeBooking(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const date = normalizeDate(raw.date);
    const start_time = normalizeTime(raw.start_time);
    const end_time = normalizeTime(raw.end_time);
    if (!date || !start_time || !end_time) return null;
    const startMin = toMin(start_time), endMin = toMin(end_time);
    if (endMin <= startMin) return null;
    return { ...raw, room: String(raw.room ?? '').trim(), topic: String(raw.topic ?? ''), booker_name: String(raw.booker_name ?? ''), date, start_time, end_time, startMin, endMin };
  }
  const signature = b => JSON.stringify([b.room, b.date, b.start_time, b.end_time, b.topic, b.booker_name, b.created_at ?? '']);

  let loadingPromise = null;
  async function loadData({ force = false } = {}) {
    if (loadingPromise) {
      if (!force) return loadingPromise;
      await loadingPromise;
    }
    setRefreshing(true);
    loadingPromise = (async () => {
      try {
        bookings = await api.read();
        dataStatus = 'ok';
        lastUpdated = new Date();
        return true;
      } catch (e) {
        console.error('โหลดข้อมูลไม่สำเร็จ:', e);
        dataStatus = lastUpdated ? 'stale' : 'error';
        return false;
      }
    })();
    const ok = await loadingPromise;
    loadingPromise = null;
    setRefreshing(false);
    renderAll();
    return ok;
  }

  // ---------- helpers ----------
  function roomInfo(value) {
    return ROOMS.find(r => r.value === value) || { value, emoji: '🏢', th: value, en: value, shortTh: value, shortEn: value };
  }
  const roomLabel = r => lang === 'th' ? r.th : r.en;
  const roomAlt = r => lang === 'th' ? r.en : r.th;
  const roomShort = r => lang === 'th' ? r.shortTh : r.shortEn;
  const timeLabel = min => fromMin(min) + T().timeUnit;
  function formatShortDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return lang === 'th' ? `${d} ${T().monthShort[m - 1]} ${y + 543}` : `${T().monthShort[m - 1]} ${d}, ${y}`;
  }
  function relativeDay(dateStr) {
    const diff = Math.round((parseDateStr(dateStr) - parseDateStr(todayStr())) / 86400000);
    if (diff === 0) return T().today;
    if (diff === 1) return T().tomorrow;
    return `${T().dayShort[parseDateStr(dateStr).getDay()]} ${formatShortDate(dateStr)}`;
  }
  const isPastBooking = b => b.date < todayStr() || (b.date === todayStr() && b.endMin <= nowMin());
  const overlaps = (b, s, e) => b.startMin < e && b.endMin > s;
  function hasConflict(room, date, s, e) {
    return bookings.some(b => b.room === room && b.date === date && overlaps(b, s, e));
  }

  // ---------- rendering ----------
  function renderAll() {
    renderStatus();
    renderTable();
    renderUpcoming();
    if (isAdmin) renderAdminList();
    if (openModals.includes('booking-modal') && !submitting) refreshTimeOptions({ preserve: true });
  }

  function setRefreshing(on) { $('refresh-icon').classList.toggle('animate-spin', on); }

  function renderStatus() {

  // จัดกลุ่มการจองของห้องหนึ่งเป็นช่อง (รองรับการจองคร่อมช่วง/ซ้อนกัน โดยไม่ทำตารางพัง)
  function planColumn(list) {
    const plan = new Array(SLOTS.length).fill(null);
    const items = list.map(b => {
      let first = -1, last = -1;
      SLOTS.forEach((s, i) => { if (overlaps(b, s.start, s.end)) { if (first < 0) first = i; last = i; } });
      return first < 0 ? null : { b, first, last };
    }).filter(Boolean).sort((a, z) => a.first - z.first || a.b.startMin - z.b.startMin);
    let i = 0;
    while (i < items.length) {
      const first = items[i].first;
      let last = items[i].last;
      const group = [items[i].b];
      let j = i + 1;
      while (j < items.length && items[j].first <= last) { last = Math.max(last, items[j].last); group.push(items[j].b); j++; }
      group.sort((a, z) => a.startMin - z.startMin);
      plan[first] = { span: last - first + 1, bookings: group };
      for (let k = first + 1; k <= last; k++) plan[k] = 'skip';
      i = j;
    }
    return plan;
  }
  function groupHasOverlap(group) {
    let maxEnd = -1;
    for (const b of group) { if (b.startMin < maxEnd) return true; maxEnd = Math.max(maxEnd, b.endMin); }
    return false;
  }

  function refreshTimeOptions({ preferStart = null, preserve = false } = {}) {
    const L = T();
    const room = $('booking-room').value;
    const date = $('booking-date').value;
    const startSel = $('booking-start');
    const prevStart = preserve && startSel.value !== '' ? Number(startSel.value) : null;
    const prevEnd = preserve && $('booking-end').value !== '' ? Number($('booking-end').value) : null;
    const dayBookings = room && date ? bookings.filter(b => b.room === room && b.date === date) : [];
    const today = todayStr();
    const nm = nowMin();
    const ok = [];
    startSel.innerHTML = SLOTS.map(s => {
      const booked = dayBookings.some(b => overlaps(b, s.start, s.end));
      const past = !date || date < today || (date === today && s.end <= nm);
      if (!booked && !past) ok.push(s.start);
      return `<option value="${s.start}"${booked || past ? ' disabled' : ''}>${timeLabel(s.start)}${booked ? L.bookedSuffix : past ? L.pastSuffix : ''}</option>`;
    }).join('');
    const pick = [preferStart, prevStart].find(v => v !== null && ok.includes(Number(v)));
    if (pick !== undefined) startSel.value = String(pick);
    else if (ok.length) startSel.value = String(ok[0]);
    else startSel.selectedIndex = -1;

    const hint = $('slot-hint');
    if (!room) { hint.textContent = L.pickRoomFirst; hint.classList.remove('hidden'); }
    else if (date && date >= today && !ok.length) { hint.textContent = L.roomFull; hint.classList.remove('hidden'); }
    else hint.classList.add('hidden');

    updateEndOptions(prevEnd, dayBookings);
    refreshSubmitState();

  function updateEndOptions(preferEnd = null, dayBookings = null) {
    const endSel = $('booking-end');
    const startSel = $('booking-start');
    if (startSel.selectedIndex < 0 || startSel.value === '') { endSel.innerHTML = ''; return; }
    const room = $('booking-room').value, date = $('booking-date').value;
    const list = dayBookings || (room && date ? bookings.filter(b => b.room === room && b.date === date) : []);
    const start = Number(startSel.value);
    const limit = Math.min(CLOSE_MIN, ...list.filter(b => b.startMin > start).map(b => b.startMin));
    const ends = SLOTS.filter(s => s.start >= start && s.end <= limit).map(s => s.end);
    endSel.innerHTML = ends.map(e => `<option value="${e}">${timeLabel(e)} · ${T().dur(e - start)}</option>`).join('');
    endSel.value = preferEnd !== null && ends.includes(preferEnd) ? String(preferEnd) : String(ends[0] ?? '');
  }

  async function handleBooking(e) {
    e.preventDefault();
    if (submitting) return;
    hideBookingError();
    const L = T();
    const room = $('booking-room').value;
    const date = $('booking-date').value;
    const topic = $('booking-topic').value.trim();
    const name = $('booking-name').value.trim();
    const startVal = $('booking-start').value;
    const endVal = $('booking-end').value;
    if (!room || !date || !topic || !name || startVal === '' || endVal === '') return showBookingError(L.fillAll);
    const startMin = Number(startVal), endMin = Number(endVal);
    const today = todayStr();
    const firstSlotEnd = Math.min(startMin + SLOT_MINUTES, CLOSE_MIN);
    if (date < today || (date === today && firstSlotEnd <= nowMin())) return showBookingError(L.pastDate);

    setSubmitting(true, L.checking);
    try {
      // 1) โหลดข้อมูลล่าสุดก่อน แล้วตรวจว่ามีคนจองตัดหน้าหรือไม่
      if (!(await loadData({ force: true }))) return showBookingError(T().connectionError);
      if (hasConflict(room, date, startMin, endMin)) { refreshTimeOptions({ preserve: true }); return showBookingError(T().conflict); }

      // 2) ส่งข้อมูลรูปแบบเดิมไปที่ Apps Script
      setSubmitting(true, T().saving);
      await api.create({ id: Date.now().toString(), room, topic, booker_name: name, date, start_time: fromMin(startMin), end_time: fromMin(endMin), created_at: new Date().toISOString() });

      // 3) โหลดใหม่และยืนยันว่ามีรายการนี้อยู่จริงในชีต
      const reloaded = await loadData({ force: true });
      const saved = reloaded && bookings.some(b => b.room === room && b.date === date && b.startMin === startMin && b.endMin === endMin);
      if (!saved) return showBookingError(T().notConfirmed);

      setSubmitting(false);
      closeModal('booking-modal');
      setViewDate(parseDateStr(date));
      showToast(T().bookSuccess, 'success');
    } finally {
      if (submitting) setSubmitting(false);
    }
  }

    deleting = true; btn.disabled = true; btn.textContent = T().deleting;
    try {
      // โหลดข้อมูลล่าสุดก่อน เพื่อใช้รหัสอ้างอิงปัจจุบันของรายการนี้ (กันลบผิดแถว)
      if (!(await loadData({ force: true }))) return showToast(T().connectionErrorShort, 'error');
      const before = bookings.filter(b => signature(b) === sig);
      if (!before.length) { closeModal('delete-confirm'); return showToast(T().alreadyDeleted, 'success'); }
      await api.remove(String(before[0].__backendId));
      const ok = await loadData({ force: true });
      const after = bookings.filter(b => signature(b) === sig).length;
      if (ok && after < before.length) { closeModal('delete-confirm'); showToast(T().deleteSuccess, 'success'); }
      else showToast(ok ? T().deleteNotConfirmed : T().connectionErrorShort, 'error');
    } finally {
      deleting = false; btn.disabled = false; btn.textContent = T().del;
    }
  }

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(message, type) {
    const toast = $('toast');
    $('toast-message').textContent = message;
    $('toast-icon').textContent = type === 'success' ? '✓' : '✕';
    toast.classList.remove('hidden', 'bg-green-600', 'bg-red-600');
    toast.classList.add('flex', type === 'success' ? 'bg-green-600' : 'bg-red-600');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('flex'); }, type === 'success' ? 3500 : 6000);
  }

  // ---------- events ----------
  function setupEventListeners() {
    $('prev-date').addEventListener('click', () => setViewDate(addDays(viewDate, -1)));
    $('next-date').addEventListener('click', () => setViewDate(addDays(viewDate, 1)));
    $('today-btn').addEventListener('click', () => setViewDate(new Date()));
    $('refresh-btn').addEventListener('click', () => loadData({ force: true }));
    $('jump-date').addEventListener('click', e => { try { e.target.showPicker(); } catch (err) { /* เบราว์เซอร์เก่าเปิดปฏิทินเอง */ } });
    $('jump-date').addEventListener('change', e => { if (e.target.value) setViewDate(parseDateStr(e.target.value)); });
    $('book-room-btn').addEventListener('click', () => openBookingModal());
    $('book-room-fab').addEventListener('click', () => openBookingModal());
    $('admin-btn').addEventListener('click', openAdminModal);
    $('admin-logout').addEventListener('click', logoutAdmin);
    $('admin-login').addEventListener('submit', handleAdminLogin);
    $('admin-filter-room').addEventListener('change', renderAdminList);
    $('admin-filter-period').addEventListener('change', renderAdminList);
    $('admin-search').addEventListener('input', renderAdminList);
    $('booking-form').addEventListener('submit', handleBooking);
    $('booking-room').addEventListener('change', () => { hideBookingError(); refreshTimeOptions({ preserve: true }); });
    $('booking-date').addEventListener('change', () => { hideBookingError(); refreshTimeOptions({ preserve: true }); });
    $('booking-start').addEventListener('change', () => { hideBookingError(); updateEndOptions(); });
    $('confirm-delete').addEventListener('click', confirmDelete);
    $('lang-th').addEventListener('click', () => setLanguage('th'));
    $('lang-en').addEventListener('click', () => setLanguage('en'));

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-close],[data-book-room],[data-goto-date],[data-delete-index],[data-action="retry"]');
      if (!t) return;
      if (t.dataset.close) return closeModal(t.dataset.close);
      if (t.dataset.action === 'retry') return loadData({ force: true });
      if (t.dataset.bookRoom) return openBookingModal({ room: t.dataset.bookRoom, date: toDateStr(viewDate), start: Number(t.dataset.bookStart) });
      if (t.dataset.gotoDate) { setViewDate(parseDateStr(t.dataset.gotoDate)); return $('schedule-section').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      if (t.dataset.deleteIndex !== undefined) return showDeleteConfirm(Number(t.dataset.deleteIndex));
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && openModals.length) closeModal(openModals[openModals.length - 1]);
    });

    // อัปเดตข้อมูลอัตโนมัติ และเมื่อกลับมาที่แท็บนี้
    setInterval(() => { if (document.visibilityState === 'visible' && !submitting && !deleting) loadData(); }, AUTO_REFRESH_SECONDS * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !submitting && !deleting && (!lastUpdated || Date.now() - lastUpdated > 30000)) loadData();
    });
    // อัปเดตแถบ "ตอนนี้" และช่องที่ผ่านไปแล้วทุกนาที
    setInterval(() => { if (lastUpdated) { renderTable(); renderUpcoming(); } }, 60000);
  }

  // ---------- start ----------
  function init() {
    applyStaticI18n();
    fillRoomSelects();
    renderTableHead();
    updateDateDisplay();
    setupEventListeners();   // ผูกปุ่มก่อน ไม่ต้องรอข้อมูล
    renderAll();             // แสดงโครงตารางระหว่างโหลด
    loadData();
  }
  init();
  </script>
 </body>
</html>
